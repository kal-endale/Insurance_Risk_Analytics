name: Python CI

on:
  push:
    branches: [ "main", "master", "task-1" ]
  pull_request:
    branches: [ "main", "master", "task-1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero to treat all errors as warnings. The GitHub editor is 1-indexed
        # flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    - name: Test with pytest
      run: |
        # You'll add your actual tests here later.
        # For now, let's just make sure pytest can be installed.
        pip install pytest
        echo "No tests defined yet. Add your tests here!"